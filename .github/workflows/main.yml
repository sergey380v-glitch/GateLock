name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unrar and locate files
      run: |
        sudo apt-get update && sudo apt-get install -y unrar
        unrar x -o+ GateLock-android-project.rar .
        # Переміщуємо вміст з підпапок в корінь
        find . -maxdepth 3 -name "gradlew" -exec dirname {} \; | head -n 1 | xargs -I {} mv {}/* . 2>/dev/null || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
